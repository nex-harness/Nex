name: Build and Release

on:
  push:
    branches: [main, feat/nex-v3]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  # Fallback app version for non-tag builds; tag builds use the tag name.
  APP_VERSION_FALLBACK: "0.2.0"

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="${APP_VERSION_FALLBACK}-dev+${GITHUB_SHA::7}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VER}"

  server-artifacts:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build & Test Web UI
        run: |
          npm --prefix clients/web ci
          npm --prefix clients/web test
          npm --prefix clients/web run build

      - name: Run Go Unit Tests (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go test ./...

      - name: Build Multi-Platform Server, Runner & Relay Artifacts
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist/artifacts

          # Package server distributions (each includes bundled multi-platform runners & version.json)
          SKIP_WEB=1 ./scripts/package-server.sh linux amd64
          SKIP_WEB=1 ./scripts/package-server.sh linux arm64
          SKIP_WEB=1 ./scripts/package-server.sh darwin arm64
          SKIP_WEB=1 ./scripts/package-server.sh darwin amd64
          cp dist/nex-server-*.tar.gz dist/artifacts/

          # Standalone nex-runner binaries
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/artifacts/nex-runner-linux-amd64 ./cmd/nex-runner
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/artifacts/nex-runner-linux-arm64 ./cmd/nex-runner
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/artifacts/nex-runner-darwin-arm64 ./cmd/nex-runner
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/artifacts/nex-runner-darwin-amd64 ./cmd/nex-runner
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/artifacts/nex-runner-windows-amd64.exe ./cmd/nex-runner

          REL_BASE=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            REL_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION}" COMMIT_SHA="${GITHUB_SHA:-unknown}" RELEASE_BASE_URL="${REL_BASE}" \
            OUT_FILE=dist/artifacts/runner-manifest.json \
            ./scripts/gen-runner-manifest.sh dist/artifacts

          # Standalone nex-relay binaries
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/artifacts/nex-relay-linux-amd64 ./cmd/nex-relay
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/artifacts/nex-relay-linux-arm64 ./cmd/nex-relay
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/artifacts/nex-relay-darwin-arm64 ./cmd/nex-relay
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/artifacts/nex-relay-darwin-amd64 ./cmd/nex-relay

      - name: Upload Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-artifacts
          path: dist/artifacts/*

  desktop-macos:
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sync App Version
        run: |
          chmod +x scripts/set-app-version.sh
          ./scripts/set-app-version.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Build macOS Desktop Client (.app / .dmg)
        run: |
          npm --prefix clients/web ci
          npm --prefix clients/web run build
          ./scripts/build-clients.sh desktop-macos

      - name: Build iOS Simulator App
        run: ./scripts/build-clients.sh ios-sim

      - name: Package iOS Simulator Bundle
        run: |
          mkdir -p dist/artifacts
          if [ -d dist/clients/ios-simulator/Nex.app ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/clients/ios-simulator/Nex.app dist/artifacts/nex-ios-simulator.app.zip
          fi
          find dist/clients -maxdepth 3 -type f -name '*.dmg' -exec cp {} dist/artifacts/ \; || true
          ls -lh dist/artifacts/

      - name: Upload macOS / iOS Simulator Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/artifacts/*
          if-no-files-found: warn

  desktop-linux-windows:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sync App Version
        run: |
          chmod +x scripts/set-app-version.sh
          ./scripts/set-app-version.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Build Linux & Windows Desktop Clients
        run: |
          npm --prefix clients/web ci
          npm --prefix clients/web run build
          ./scripts/build-clients.sh desktop-windows
          ./scripts/build-clients.sh desktop-linux

      - name: Collect Desktop Artifacts
        run: |
          mkdir -p dist/artifacts
          find dist/clients -maxdepth 3 -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name 'nex-*-linux-*.tar.gz' -o -name 'PKGBUILD' \) -exec cp {} dist/artifacts/ \; || true
          ls -lh dist/artifacts/

      - name: Upload Linux / Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-windows-artifacts
          path: dist/artifacts/*
          if-no-files-found: warn

  android:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          export PATH="${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/platform-tools:${PATH}"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          # Accept licenses and install the packages mygo's Android build needs
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Sync App Version
        run: |
          chmod +x scripts/set-app-version.sh
          ./scripts/set-app-version.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Build Android APK / AAB
        run: |
          npm --prefix clients/web ci
          npm --prefix clients/web run build
          ./scripts/build-clients.sh android

      - name: Collect Android Artifacts
        run: |
          mkdir -p dist/artifacts
          find dist/clients -maxdepth 3 -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} dist/artifacts/ \; || true
          ls -lh dist/artifacts/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/artifacts/*
          if-no-files-found: warn

  release:
    needs: [resolve-version, server-artifacts, desktop-macos, desktop-linux-windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
          pattern: "*-artifacts"
          merge-multiple: true

      - name: Generate Update Manifest & Checksums
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist/artifacts
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tag": "${GITHUB_REF_NAME}",
            "repo": "${GITHUB_REPOSITORY}"
          }
          EOF
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/artifacts/*
          generate_release_notes: true

  docker-images:
    needs: server-artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/nex-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build & Push nex-server Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}

      - name: Extract Docker metadata (relay)
        id: meta-relay
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/nex-relay
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build & Push nex-relay Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-relay.outputs.tags }}
          labels: ${{ steps.meta-relay.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
