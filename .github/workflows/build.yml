name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  # Fallback app version for non-tag builds; tag builds use the tag name.
  APP_VERSION_FALLBACK: "0.4.1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="${APP_VERSION_FALLBACK}-dev+${GITHUB_SHA::7}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VER}"

  server-artifacts:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build & Test Web UI
        run: |
          npm --prefix clients/web ci
          npm --prefix clients/web test
          npm --prefix clients/web run build

      - name: Run Go Unit Tests (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go test ./...

      - name: Build Multi-Platform Server, Runner & Relay Artifacts
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist/artifacts

          # Package server distributions (lightweight: nex-server binary + configs, no bundled runners)
          SKIP_WEB=1 ./scripts/package-server.sh linux amd64
          SKIP_WEB=1 ./scripts/package-server.sh linux arm64
          SKIP_WEB=1 ./scripts/package-server.sh darwin arm64
          SKIP_WEB=1 ./scripts/package-server.sh darwin amd64
          cp dist/nex-server-*.tar.gz dist/artifacts/

          # Standalone non-macOS nex-runner binaries (versioned filenames; macOS runners are built & signed in desktop-macos)
          VER_TAG="v${VERSION#v}"
          SHORT_SHA="${GITHUB_SHA:-unknown}"
          if [ "$SHORT_SHA" != "unknown" ]; then
            SHORT_SHA="${SHORT_SHA:0:7}"
          fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.buildSHA=${SHORT_SHA}" -o "dist/artifacts/nex-runner-${VER_TAG}-linux-amd64" ./cmd/nex-runner
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.buildSHA=${SHORT_SHA}" -o "dist/artifacts/nex-runner-${VER_TAG}-linux-arm64" ./cmd/nex-runner
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.buildSHA=${SHORT_SHA}" -o "dist/artifacts/nex-runner-${VER_TAG}-windows-amd64.exe" ./cmd/nex-runner

          # Standalone nex-relay binaries (versioned filenames)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/artifacts/nex-relay-${VER_TAG}-linux-amd64" ./cmd/nex-relay
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/artifacts/nex-relay-${VER_TAG}-linux-arm64" ./cmd/nex-relay
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/artifacts/nex-relay-${VER_TAG}-darwin-arm64" ./cmd/nex-relay
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/artifacts/nex-relay-${VER_TAG}-darwin-amd64" ./cmd/nex-relay

          # Package Nex Browser Bridge MV3 extension (Chrome / Edge / headless=new Chromium)
          (cd clients/browser-ext && zip -r "../../dist/artifacts/nex-browser-ext-${VER_TAG}.zip" .)

      - name: Upload Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-artifacts
          path: dist/artifacts/*

  desktop-macos:
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sync App Version
        run: |
          chmod +x scripts/set-app-version.sh
          ./scripts/set-app-version.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Import macOS Signing Certificate
        if: vars.NEX_ENABLE_MAC_SIGN == '1'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          KEYCHAIN=build.keychain-db
          echo "$APPLE_CERT_P12" | base64 --decode -o /tmp/nex-signing.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import /tmp/nex-signing.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f /tmp/nex-signing.p12

      - name: Build macOS Desktop Client (.app / .dmg)
        run: |
          npm --prefix clients/web ci
          npm --prefix clients/web run build
          ./scripts/build-clients.sh desktop-macos

      - name: Sign & Notarize macOS App & DMG
        if: vars.NEX_ENABLE_MAC_SIGN == '1'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          APP_PATH="$(find dist/clients -maxdepth 4 -type d -name 'Nex.app' | grep -v 'ios-simulator' | head -n 1 || true)"
          if [ -n "$APP_PATH" ]; then
            echo "[sign] signing $APP_PATH with $APPLE_SIGNING_IDENTITY"
            codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
            codesign --verify --deep --strict "$APP_PATH"
          fi
          while IFS= read -r -d '' dmg; do
            echo "[sign] signing DMG $dmg"
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
            echo "[notarize] submitting $dmg"
            xcrun notarytool submit "$dmg" --no-s3-acceleration \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl -a -t open --context context:primary-signature "$dmg"
          done < <(find dist/clients -maxdepth 3 -type f -name '*.dmg' -print0)

      - name: Build iOS Simulator App
        run: ./scripts/build-clients.sh ios-sim

      - name: Build, Sign & Package macOS Runners (arm64 / amd64)
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          NEX_ENABLE_MAC_SIGN: ${{ vars.NEX_ENABLE_MAC_SIGN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir -p dist/artifacts
          VER_TAG="v${VERSION#v}"
          SHORT_SHA="${GITHUB_SHA:-unknown}"
          if [ "$SHORT_SHA" != "unknown" ]; then
            SHORT_SHA="${SHORT_SHA:0:7}"
          fi
          for arch in arm64 amd64; do
            out="dist/artifacts/nex-runner-${VER_TAG}-darwin-${arch}"
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION} -X main.buildSHA=${SHORT_SHA}" \
              -o "$out" ./cmd/nex-runner
            if [ "${NEX_ENABLE_MAC_SIGN:-}" = "1" ]; then
              echo "[sign] signing $out with $APPLE_SIGNING_IDENTITY"
              codesign --force --options runtime --timestamp --identifier com.nex.runner \
                --sign "$APPLE_SIGNING_IDENTITY" "$out"
              codesign --verify --strict "$out"
            fi
          done

      - name: Package macOS / iOS Simulator Artifacts
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist/artifacts
          VER_TAG="v${VERSION#v}"
          if [ -d dist/clients/ios-simulator/Nex.app ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/clients/ios-simulator/Nex.app "dist/artifacts/nex-ios-simulator-${VER_TAG}.app.zip"
          fi
          while IFS= read -r -d '' dmg; do
            base="$(basename "$dmg")"
            if [[ "$base" != *"${VERSION}"* ]]; then
              cp "$dmg" "dist/artifacts/Nex-${VER_TAG}-darwin-arm64.dmg"
            else
              cp "$dmg" "dist/artifacts/${base}"
            fi
          done < <(find dist/clients -maxdepth 3 -type f -name '*.dmg' -print0)
          ls -lh dist/artifacts/

      - name: Upload macOS / iOS Simulator Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/artifacts/*
          if-no-files-found: warn

  desktop-linux-windows:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sync App Version
        run: |
          chmod +x scripts/set-app-version.sh
          ./scripts/set-app-version.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Build Linux & Windows Desktop Clients
        run: |
          npm --prefix clients/web ci
          npm --prefix clients/web run build
          ./scripts/build-clients.sh desktop-windows
          ./scripts/build-clients.sh desktop-linux

      - name: Collect Desktop Artifacts
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist/artifacts
          VER_TAG="v${VERSION#v}"
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            if [[ "$base" == *"${VERSION}"* ]]; then
              cp "$f" "dist/artifacts/${base}"
              continue
            fi
            case "$base" in
              Nex.exe)
                cp "$f" "dist/artifacts/Nex-${VER_TAG}-windows-amd64.exe"
                ;;
              *.exe)
                cp "$f" "dist/artifacts/${base%.exe}-${VER_TAG}.exe"
                ;;
              *.deb)
                cp "$f" "dist/artifacts/${base%.deb}-${VER_TAG}.deb"
                ;;
              *.rpm)
                cp "$f" "dist/artifacts/${base%.rpm}-${VER_TAG}.rpm"
                ;;
              *.tar.gz)
                cp "$f" "dist/artifacts/${base%.tar.gz}-${VER_TAG}.tar.gz"
                ;;
              *)
                cp "$f" "dist/artifacts/${base}"
                ;;
            esac
          done < <(find dist/clients -maxdepth 3 -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name 'nex-*-linux-*.tar.gz' -o -name 'PKGBUILD' \) -print0)
          ls -lh dist/artifacts/

      - name: Upload Linux / Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-windows-artifacts
          path: dist/artifacts/*
          if-no-files-found: warn

  android:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          export PATH="${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/platform-tools:${PATH}"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          # Accept licenses and install the packages mygo's Android build needs
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Sync App Version
        run: |
          chmod +x scripts/set-app-version.sh
          ./scripts/set-app-version.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Build Android APK / AAB
        run: |
          npm --prefix clients/web ci
          npm --prefix clients/web run build
          ./scripts/build-clients.sh android

      - name: Collect Android Artifacts
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist/artifacts
          VER_TAG="v${VERSION#v}"
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            if [[ "$base" == *"${VERSION}"* ]]; then
              cp "$f" "dist/artifacts/${base}"
            elif [[ "$base" == *.apk ]]; then
              cp "$f" "dist/artifacts/Nex-${VER_TAG}-android-arm64.apk"
            elif [[ "$base" == *.aab ]]; then
              cp "$f" "dist/artifacts/Nex-${VER_TAG}-android-arm64.aab"
            else
              cp "$f" "dist/artifacts/${base}"
            fi
          done < <(find dist/clients -maxdepth 3 -type f \( -name '*.apk' -o -name '*.aab' \) -print0)
          ls -lh dist/artifacts/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/artifacts/*
          if-no-files-found: warn

  release:
    needs: [resolve-version, server-artifacts, desktop-macos, desktop-linux-windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
          pattern: "*-artifacts"
          merge-multiple: true

      - name: Generate Runner Manifest, Update Manifest & Checksums
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:-unknown}"
          if [ "$SHORT_SHA" != "unknown" ]; then
            SHORT_SHA="${SHORT_SHA:0:7}"
          fi
          REL_BASE=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            REL_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          fi
          chmod +x scripts/gen-runner-manifest.sh
          VERSION="${VERSION}" COMMIT_SHA="${SHORT_SHA}" RELEASE_BASE_URL="${REL_BASE}" \
            OUT_FILE=dist/artifacts/runner-manifest.json \
            ./scripts/gen-runner-manifest.sh dist/artifacts
          cd dist/artifacts
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tag": "${GITHUB_REF_NAME}",
            "repo": "${GITHUB_REPOSITORY}"
          }
          EOF
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/artifacts/*
          generate_release_notes: true

  docker-images:
    needs: [resolve-version, server-artifacts]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/nex-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build & Push nex-server Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=nex-server
          cache-to: type=gha,mode=max,scope=nex-server
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}

      - name: Extract Docker metadata (relay)
        id: meta-relay
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/nex-relay
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build & Push nex-relay Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-relay.outputs.tags }}
          labels: ${{ steps.meta-relay.outputs.labels }}
          cache-from: type=gha,scope=nex-relay
          cache-to: type=gha,mode=max,scope=nex-relay
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
