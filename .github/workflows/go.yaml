# Go rewrite checks (docs/specs/go-rewrite). Runs only when Go code, its test vectors or the
# generators change, so it does not slow unrelated pull requests.
name: Go checks

on:
  pull_request:
    branches: [main]
    paths: ["go/**", "scripts/go-rewrite/**", ".github/workflows/go.yaml", "mise.toml"]
  workflow_dispatch:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: cross-build
        shell: bash
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -buildvcs=false -o /dev/null ./cmd/nex-agent
          done
