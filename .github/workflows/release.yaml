# Release pipeline: push a tag (vX.Y.Z) or dispatch manually to build the macOS
# desktop bundles, sign/notarize when credentials are configured, and publish
# everything to a GitHub Release.
#
# electron-builder publishes with GH_TOKEN and uploads the installers together
# with latest-mac.yml, which the desktop auto-updater consumes.
#
# 发布通道：electron-builder 的 github provider（nex-harness/Nex Releases）。
# 前置条件：
#   - `pnpm bootstrap`：生成 apps/nex-cli 的 agent bundle、runtime assets 与 workspace 编译。
#   - NEX_ELECTRON_BUILDER_ARGS 由 packages/desktop/scripts/bundle.mjs 透传给
#     electron-builder（`--publish always` 依赖它）。
#
# Required repo variables/secrets (optional; unsigned build when unset):
#   vars.NEX_ENABLE_MAC_SIGN == "1"
#   secrets.APPLE_CERT_P12 / APPLE_CERT_PASSWORD (Developer ID p12, base64)
#   secrets.APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_TEAM_ID /
#   APPLE_APP_SPECIFIC_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  NEX_ENV: production
  # Do not let electron-builder auto-pick a signing identity from the local
  # keychain; signing is controlled by NEX_ENABLE_MAC_SIGN.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
  NODE_VERSION: "24.14.0"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm (pinned)
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm --version

      - name: Cache pnpm store
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Cache Electron / electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('packages/desktop/package.json', 'pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap
        run: pnpm bootstrap

      - name: Build desktop bundles
        run: pnpm --filter @nex/desktop build

      # GitHub-hosted runner 是全新 VM，钥匙串里没有证书；自建临时 keychain 导入
      # Developer ID p12（electron-builder 内置的 CSC_LINK 导入在此环境 unlock 失败）。
      - name: Import signing certificate
        if: vars.NEX_ENABLE_MAC_SIGN == '1'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          KEYCHAIN=build.keychain-db
          echo "$APPLE_CERT_P12" | base64 --decode -o /tmp/nex-signing.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import /tmp/nex-signing.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f /tmp/nex-signing.p12

      # electron-builder 在 macOS 上产出 dmg + zip + latest-mac.yml；GH_TOKEN 由
      # `--publish always` 消费（github provider，见 electron-builder.config.js）。
      # bundle.mjs 把 NEX_ELECTRON_BUILDER_ARGS 透传给 electron-builder。
      - name: Package and publish (electron-builder)
        run: pnpm bundle:desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEX_ELECTRON_BUILDER_ARGS: "--publish always"
          NEX_ENABLE_MAC_SIGN: ${{ vars.NEX_ENABLE_MAC_SIGN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      # Two-step flow: electron-builder only signs (notarize: false in config);
      # notarize and staple the artifacts here.
      - name: Notarize and staple
        if: vars.NEX_ENABLE_MAC_SIGN == '1'
        working-directory: packages/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          for artifact in dist/*.dmg dist/*.zip; do
            echo "[notarize] submit $artifact"
            xcrun notarytool submit "$artifact" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          done
          # staple supports dmg/pkg/app; zip archives are verified online by Gatekeeper.
          for dmg in dist/*.dmg; do
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
          spctl -a -vv -t exec dist/mac-arm64/*.app

      # The notarized/stapled artifacts must replace the copies uploaded by
      # electron-builder before it finished notarization.
      # 该步骤用 `gh release upload --clobber` 覆盖同名资产，要求 tag 对应的 Release 已经存在：
      # 前一步 electron-builder（`--publish always`，github provider）会创建它。
      # electron-builder 对不存在的 Release 默认创建 draft；同一个 tag 上 release-server.yaml
      # 的 softprops/action-gh-release 随后会把同一个 Release 发布出来（含服务端压缩包）。
      # 两个工作流都只在 v* tag 上运行，所以一个 tag 对应一个同时包含桌面端与服务端的 Release，
      # 与 1.2.3 的资产清单一致。
      - name: Refresh release assets after notarization
        if: vars.NEX_ENABLE_MAC_SIGN == '1'
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          for f in dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml; do
            echo "[release] re-upload $(basename "$f")"
            gh release upload "$tag" "$f" --clobber
          done

      - name: Smoke check artifacts
        run: ls -lh packages/desktop/dist/*.dmg packages/desktop/dist/*.zip packages/desktop/dist/latest-mac.yml

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nex-macos-${{ github.ref_name }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 30
