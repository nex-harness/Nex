# Publish the Nex server SEA binaries as one-step install tarballs on GitHub
# Releases.
#
# Release rules (mirrors the docker edge/latest flow):
#   - main branch update / manual dispatch -> rolling release tagged
#     alpha-<shortsha> (one release per main build, kept for rollback)
#   - v* tag push -> versioned assets on that tag's release
#
# Artifacts (the staged server-cli release: bin/nex + runtime/ + manifest.json, plus
# web/ with the matching web build). The suffix distinguishes a build of main
# (<shortsha>, kept per-commit for rollback) from a released version (<version>, the
# pushed tag):
#   nex-server-darwin-arm64-<version|shortsha>.tar.gz
#   nex-server-linux-x64-<version|shortsha>.tar.gz
#   nex-server-linux-arm64-<version|shortsha>.tar.gz
#
# The tarball also carries the matching web build (packages/web/dist) under web/.
# 2.0 的 Server Core 可以自己托管它，不需要前置代理：
#   tar -xzf nex-server-<target>-<label>.tar.gz -C nex-server && cd nex-server
#   ./bin/nex serve --daemon --web-root "$PWD/web" --port 3030   # 浏览器登录，见 docs/specs/server-web-login.md
#   ./bin/nex web-token                                          # 打印登录令牌
# 非回环监听（--host 0.0.0.0）会自动启用登录；对公网暴露请放在 TLS 反代之后。
#
# The Node version used for the build must match the license entry recorded in
# third-party/runtime/sources.json (24.14.0); CI pins it via setup-node.
name: Server binaries (SEA)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "24.14.0"
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build workspace packages and agent bundle
        run: |
          # Root typecheck emits dist for repo-root packages (@nex/shared etc.)
          # except @nex/model-option-map: it lives under packages/ too but is
          # not in the tsc -b list, so build it explicitly. The CLI workspace
          # turbo build emits dist for every apps/nex-cli package the SEA asset
          # collectors scan (node-repl-host, ...); the CLI build produces the
          # agent bundle.
          pnpm typecheck
          pnpm --filter @nex/model-option-map build
          pnpm exec turbo --skip-infer --cwd apps/nex-cli run build --filter='!@nex/cli' --force
          pnpm -r --filter "@nex/cli..." build
          # Web static assets ship inside the install tarball so a bare-metal
          # server serves a UI matching its own binary version.
          pnpm --filter @nex/web build

      # 版本发布用 tag 名（v1.2.2），main 的滚动构建用 short sha：两者的 Release 都由
      # 本工作流创建，命名必须能区分版本与逐次构建，所以不是可选项。
      - name: Resolve asset label
        id: meta
        run: |
          shortsha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "label=${shortsha}" >> "$GITHUB_OUTPUT"
          fi
          echo "shortsha=${shortsha}" >> "$GITHUB_OUTPUT"

      # 2.0 的发行形态是 server-cli staging 产物（bin/nex + runtime/ + manifest.json）。
      # staging 只能构建当前平台，因此每个 matrix.target 必须有对应的 runner 架构。
      - name: Stage server-cli release (${{ matrix.target }})
        run: pnpm --filter @nex/server-cli stage

      # 桌面「添加远程 Server」用的归档：stage 产出的 nex-server-<平台>.tar.gz（带一层顶级目录，
      # 远端用 tar --strip-components=1 解包），文件名不带标签。必须在下一步之前另存：
      # 一键安装包是另一种布局（无顶级目录 + web/），两者不能互相改名复用。
      # 见 docs/specs/remote-server-release-assets.md。
      - name: Keep the remote-install archive
        working-directory: packages/nex-server-cli/dist-release
        run: |
          mkdir -p remote
          cp nex-server-${{ matrix.target }}.tar.gz remote/

      - name: Upload remote-install archive
        uses: actions/upload-artifact@v4
        with:
          name: remote-nex-server-${{ matrix.target }}
          path: packages/nex-server-cli/dist-release/remote/nex-server-${{ matrix.target }}.tar.gz
          retention-days: 7

      - name: Package one-step install tarball
        working-directory: packages/nex-server-cli/dist-release
        run: |
          mkdir -p bundle
          cp -R nex-server-${{ matrix.target }}/. bundle/
          # Matching web build, served by `nex serve --web-root <dir>/web`.
          mkdir -p bundle/web
          cp -r ../../web/dist/. bundle/web/
          tar -czf nex-server-${{ matrix.target }}-${{ steps.meta.outputs.label }}.tar.gz -C bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nex-server-${{ matrix.target }}-${{ steps.meta.outputs.label }}
          path: packages/nex-server-cli/dist-release/nex-server-${{ matrix.target }}-${{ steps.meta.outputs.label }}.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download install tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: nex-server-*
          merge-multiple: true
          path: dist

      - name: Download remote-install archives
        uses: actions/download-artifact@v4
        with:
          pattern: remote-nex-server-*
          merge-multiple: true
          path: remote-dist

      - uses: actions/setup-node@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          version: 10.33.2

      # 桌面「添加远程 Server」从与 App 同一个 Release 取 source-server-release.json 和
      # nex-server-<平台>.tar.gz（见 docs/specs/remote-server-release-assets.md）。
      # 索引由与本地 prepare:remote-assets 相同的收集函数生成（含 sha256 与大小），缺任何一个平台都会失败。
      - name: Build remote-install release index (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pnpm install --frozen-lockfile --filter @nex/server-cli...
          pnpm --filter @nex/server-cli exec tsx src/packaging/stageRemoteAssetsCli.ts \
            --collect-only --dist "$GITHUB_WORKSPACE/remote-dist" --out "$GITHUB_WORKSPACE/remote-release"
          ls -l remote-release/releases/*/
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Publish versioned release (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nex-server-*.tar.gz
            remote-release/releases/*/source-server-release.json
            remote-release/releases/*/nex-server-*.tar.gz

      - name: Resolve short sha
        id: meta
        run: echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # main update -> a rolling alpha-<shortsha> release: each main build gets
      # its own alpha release (tag pinned to that commit, history kept).
      - name: Publish alpha release (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shortsha="${GITHUB_SHA::7}"
          tag="alpha-${shortsha}"
          notes="Alpha build of the Nex server at commit ${GITHUB_SHA}. Extract the tarball for your platform and run \`./bin/nex serve --daemon --web-root \"\$PWD/web\" --port 3030\`, then \`./bin/nex web-token\` for the browser login token."
          # --prerelease --latest=false: 桌面端自动更新读取 GitHub 的 releases/latest；
          # 服务端 alpha 不含 latest-mac.yml，一旦被标为 Latest，所有桌面稳定通道的更新检查都会失败。
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nex server (${tag})" \
            --prerelease \
            --latest=false \
            --notes "$notes" \
            dist/nex-server-*-${shortsha}.tar.gz
