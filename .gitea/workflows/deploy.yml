name: Build and Deploy Nex-v3 (Linux)

on:
  push:
    branches: [main, feat/nex-v3]
  workflow_dispatch:

concurrency:
  group: deploy-nex-v3
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Web UI (embedded into pkg/webui/dist)
        run: |
          npm --prefix clients/web ci
          npm --prefix clients/web run build

      - name: Run Go Unit Tests (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go test ./...

      - name: Build Linux amd64 Binaries (CGO_ENABLED=0)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/nex-server ./cmd/nex-server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/nex-runner ./cmd/nex-runner
          ls -lh dist/nex-server dist/nex-runner

      - name: Deploy to RemoteBuilder (nex.tylinux.cn)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_HOST:-192.168.123.42}"
          USER="${DEPLOY_USER:-tylinux}"

          TMP_KEY="$(mktemp)"
          trap 'rm -f "$TMP_KEY"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$TMP_KEY"
          chmod 600 "$TMP_KEY"

          SSH_OPTS="-i $TMP_KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes"

          # Upload new binaries to staging paths on RemoteBuilder
          ssh $SSH_OPTS "${USER}@${HOST}" "mkdir -p /opt/nex-v3/bin"
          scp $SSH_OPTS dist/nex-server "${USER}@${HOST}:/opt/nex-v3/bin/nex-server.new"
          scp $SSH_OPTS dist/nex-runner "${USER}@${HOST}:/opt/nex-v3/bin/nex-runner.new"

          # Atomically swap binaries and restart systemd services
          ssh $SSH_OPTS "${USER}@${HOST}" 'set -euo pipefail
            chmod +x /opt/nex-v3/bin/nex-server.new /opt/nex-v3/bin/nex-runner.new
            mv -f /opt/nex-v3/bin/nex-server.new /opt/nex-v3/bin/nex-server
            mv -f /opt/nex-v3/bin/nex-runner.new /opt/nex-v3/bin/nex-runner
            sudo systemctl restart nex-v3-server.service
            sleep 1
            sudo systemctl restart nex-v3-runner.service
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:80/api/v1/health >/dev/null 2>&1; then
                break
              fi
              sleep 0.5
            done
            curl -fsS http://127.0.0.1:80/api/v1/health
            echo ""
            sudo systemctl is-active nex-v3-server.service nex-v3-runner.service
          '

      - name: Verify Public Endpoint (https://nex.tylinux.cn)
        run: |
          set -euo pipefail
          sleep 2
          curl -fsSI https://nex.tylinux.cn | head -n 5
          curl -fsS https://nex.tylinux.cn/api/v1/runners
          echo ""
