name: Build and Deploy Nex-v3 (Linux)

on:
  push:
    branches: [main, feat/nex-v3]
  workflow_dispatch:

concurrency:
  group: deploy-nex-v3
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Web UI (embedded into pkg/webui/dist)
        run: |
          npm --prefix clients/web ci
          npm --prefix clients/web test
          npm --prefix clients/web run build

      - name: Run Go Unit Tests (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go test ./...

      - name: Build Linux amd64 Binaries & Multi-Platform Runners (CGO_ENABLED=0)
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          BASE_VER="$(node -p "require('./mygo.json').version")"
          SHA="$(git rev-parse --short=7 HEAD 2>/dev/null || echo unknown)"
          VER="v${BASE_VER#v}-local"
          export VERSION="$VER"
          export COMMIT_SHA="$SHA"
          mkdir -p dist/runners
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VER} -X main.buildSHA=${SHA}" -o dist/nex-server ./cmd/nex-server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VER} -X main.buildSHA=${SHA}" -o dist/nex-runner ./cmd/nex-runner
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VER} -X main.buildSHA=${SHA}" -o dist/runners/nex-runner-linux-amd64 ./cmd/nex-runner
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${VER} -X main.buildSHA=${SHA}" -o dist/runners/nex-runner-linux-arm64 ./cmd/nex-runner
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${VER} -X main.buildSHA=${SHA}" -o dist/runners/nex-runner-darwin-arm64 ./cmd/nex-runner
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VER} -X main.buildSHA=${SHA}" -o dist/runners/nex-runner-darwin-amd64 ./cmd/nex-runner
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VER} -X main.buildSHA=${SHA}" -o dist/runners/nex-runner-windows-amd64.exe ./cmd/nex-runner
          if [ -n "${APPLE_CERT_P12:-}" ] && [ -n "${APPLE_CERT_PASSWORD:-}" ]; then
            RCODESIGN_BIN="$(command -v rcodesign || true)"
            if [ -z "$RCODESIGN_BIN" ]; then
              mkdir -p /tmp/rcodesign-bin
              curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz" \
                | tar -xz -C /tmp/rcodesign-bin --strip-components=1
              RCODESIGN_BIN="/tmp/rcodesign-bin/rcodesign"
              chmod +x "$RCODESIGN_BIN"
            fi
            TMP_P12="$(mktemp)"
            TMP_PW="$(mktemp)"
            trap 'rm -f "$TMP_P12" "$TMP_PW"' EXIT
            printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$TMP_P12"
            printf '%s' "$APPLE_CERT_PASSWORD" > "$TMP_PW"
            chmod 600 "$TMP_P12" "$TMP_PW"
            for bin in dist/runners/nex-runner-darwin-arm64 dist/runners/nex-runner-darwin-amd64; do
              echo "[sign] cross-signing $bin with Developer ID certificate"
              "$RCODESIGN_BIN" sign \
                --p12-file "$TMP_P12" \
                --p12-password-file "$TMP_PW" \
                --binary-identifier com.nex.runner \
                --code-signature-flags runtime \
                "$bin"
            done
          fi
          VERSION="$VER" COMMIT_SHA="$SHA" ./scripts/gen-runner-manifest.sh dist/runners
          SKIP_WEB=1 ./scripts/package-server.sh linux amd64
          ls -lh dist/nex-server dist/nex-runner dist/runners/

      - name: Deploy to RemoteBuilder
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          USER="${DEPLOY_USER:?DEPLOY_USER secret is required}"

          TMP_KEY="$(mktemp)"
          trap 'rm -f "$TMP_KEY"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$TMP_KEY"
          chmod 600 "$TMP_KEY"

          SSH_OPTS="-i $TMP_KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes"

          # Upload new binaries, bundled multi-platform runners, and startup config templates on RemoteBuilder
          ssh $SSH_OPTS "${USER}@${HOST}" "mkdir -p /opt/nex-v3/bin /opt/nex-v3/runners /opt/nex-v3/config"
          scp $SSH_OPTS dist/nex-server "${USER}@${HOST}:/opt/nex-v3/bin/nex-server.new"
          scp $SSH_OPTS dist/nex-runner "${USER}@${HOST}:/opt/nex-v3/bin/nex-runner.new"
          scp $SSH_OPTS dist/runners/* "${USER}@${HOST}:/opt/nex-v3/runners/"
          scp -r $SSH_OPTS deploy/* "${USER}@${HOST}:/opt/nex-v3/config/"

          # Atomically swap binaries and restart systemd services
          ssh $SSH_OPTS "${USER}@${HOST}" 'set -euo pipefail
            chmod +x /opt/nex-v3/bin/nex-server.new /opt/nex-v3/bin/nex-runner.new /opt/nex-v3/runners/nex-runner-*
            mv -f /opt/nex-v3/bin/nex-server.new /opt/nex-v3/bin/nex-server
            mv -f /opt/nex-v3/bin/nex-runner.new /opt/nex-v3/bin/nex-runner
            sudo systemctl restart nex-v3-server.service
            sleep 1
            sudo systemctl restart nex-v3-runner.service
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:80/api/v1/health >/dev/null 2>&1; then
                break
              fi
              sleep 0.5
            done
            curl -fsS http://127.0.0.1:80/api/v1/health
            echo ""
            sudo systemctl is-active nex-v3-server.service nex-v3-runner.service
          '

      - name: Verify Public Endpoint
        env:
          DEPLOY_PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_PUBLIC_URL:-}" ]; then
            echo "DEPLOY_PUBLIC_URL not set, skipping public endpoint verification"
            exit 0
          fi
          sleep 2
          curl -fsSI "$DEPLOY_PUBLIC_URL" | head -n 5
          curl -fsS "${DEPLOY_PUBLIC_URL}/api/v1/health"
          echo ""
          curl -fsS "${DEPLOY_PUBLIC_URL}/api/v1/auth/status"
          echo ""
