<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nex — Web + Server</title>
    <style>
      html { background-color: #f8f8f8; color: #262626; }
      html.dark { background-color: #161616; color: #f5f5f5; }
      body { margin: 0; background-color: inherit; color: inherit; }
      @media (prefers-color-scheme: dark) {
        html:not(.light-forced) { background-color: #161616; color: #f5f5f5; }
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nex.theme') || 'system';
          var d = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.add('light-forced');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-sky-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
