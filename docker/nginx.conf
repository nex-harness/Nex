# nginx 模板：对外入口。
# entrypoint.sh 启动时用 envsubst 渲染 ${NEX_CORE_HOST} / ${NEX_CORE_PORT} / ${NEX_INGRESS_TOKEN}。
#
# 分工：Web 静态资源由 nginx 直接提供（core 不托管 UI）；
# /api 与 /ws 反代到回环上的 server-core，并注入它要求的 Bearer token。
server {
    listen 3030;
    server_name _;

    root /app/web;
    index index.html;

    # 静态资源与 SPA 路由：找不到文件时回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 与 WebSocket 走 core。core 的 ingress token 只在这里注入，不暴露给浏览器。
    location /api/ {
        proxy_pass http://${NEX_CORE_HOST}:${NEX_CORE_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer ${NEX_INGRESS_TOKEN}";
    }

    location /ws {
        proxy_pass http://${NEX_CORE_HOST}:${NEX_CORE_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization "Bearer ${NEX_INGRESS_TOKEN}";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/host {
        proxy_pass http://${NEX_CORE_HOST}:${NEX_CORE_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
