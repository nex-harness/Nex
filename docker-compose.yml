# Nex server（单容器：nginx 提供 Web UI，server-core 在容器内提供 API 与 WebSocket）。
#
# 构建前先在 Linux 主机（或匹配架构的 runner）上准备产物：
#   pnpm --filter @nex/web build
#   pnpm --filter @nex/server-cli stage
#   scripts/stage-docker-context.sh linux-x64
#   docker compose up -d --build
#
# 鉴权：server-core 每次启动生成一个 ingress token，写到 /data/run/ingress-token，
# 由 nginx 在反代 /api 与 /ws 时注入 Authorization。浏览器不接触该 token。
# 对外访问控制应放在本容器之前（反向代理 + TLS + 自己的登录层）。
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      NEX_ENV: production
      NEX_DATA_BASE_DIR: /data
      NEX_SERVER_PORT: "3030"
    volumes:
      - nex-data:/data # 会话/设置/凭据等全部状态
      - nex-workspace:/workspace # server 侧默认工作区
    restart: unless-stopped

volumes:
  nex-data:
  nex-workspace:
